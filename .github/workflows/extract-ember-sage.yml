name: Extract Ember & Sage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract restaurant project
        shell: bash
        run: |
          set -e
          ZIP="projects/ember-sage/ember-sage.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Ember & Sage archive not found; nothing to extract."
            exit 0
          fi
          rm -rf /tmp/ember-sage
          mkdir -p /tmp/ember-sage
          unzip -q "$ZIP" -d /tmp/ember-sage
          cp -R /tmp/ember-sage/ember-sage/. projects/ember-sage/
          rm -f "$ZIP"

      - name: Commit extracted project
        shell: bash
        run: |
          set -e
          if git diff --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/ember-sage
          git commit -m "Extract Ember & Sage restaurant project [skip ci]"
          git push
